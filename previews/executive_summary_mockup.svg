      .axis { font: 400 12px 'Segoe UI', Arial, sans-serif; fill: #738494; }
      .label { font: 600 13px 'Segoe UI', Arial, sans-serif; fill: #47647C; }
      .note { font: 400 14px 'Segoe UI', Arial, sans-serif; fill: #334155; }
